[project]
name = "mcp_cube_server"
version = "0.1.2"
description = "MCP server for interfacing with Cube.dev REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.1,<2",
    # Transitive via mcp -> pyjwt[crypto]. Pinned below 49 because cryptography
    # dropped the macosx universal2 wheels in 49.0.0 (arm64-only since then),
    # which forces a source build (Rust toolchain) on Intel Macs.
    "cryptography>=44,<49",
    "pyjwt>=2.10.1",
    "python-dotenv",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    # Verify TLS against the OS trust store, so corporate proxies that re-sign
    # HTTPS with a private root CA (absent from certifi) do not break every call.
    "truststore>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pyright>=1.1.389"]

[project.scripts]
mcp_cube_server = "mcp_cube_server:main"
mcp-cube-login = "mcp_cube_server.auth:login_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cube_server"]
